# Server
server.port=8080

# H2 Database (Persistencia en archivo en disco)
spring.datasource.url=jdbc:h2:file:./data/clientesdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# SpringDoc / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# App Info
spring.application.name=Clientes API
info.app.name=Clientes API
info.app.description=CRUD de Clientes - Prueba Tecnica
info.app.version=1.0.0

# Logging
logging.level.com.prueba=DEBUG
